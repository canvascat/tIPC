packages:
  - "packages/*"

# electron-builder expects a hoisted layout:
# https://github.com/electron-userland/electron-builder/issues/6289#issuecomment-1042620422
shamefullyHoist: true

allowBuilds:
  "@tailwindcss/oxide": true
  electron: true
  electron-winstaller: true

minimumReleaseAgeExclude:
  - "@oxlint/binding-android-arm-eabi@1.92.0"
  - "@oxlint/binding-android-arm64@1.92.0"
  - "@oxlint/binding-darwin-arm64@1.92.0"
  - "@oxlint/binding-darwin-x64@1.92.0"
  - "@oxlint/binding-freebsd-x64@1.92.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.92.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.92.0"
  - "@oxlint/binding-linux-arm64-gnu@1.92.0"
  - "@oxlint/binding-linux-arm64-musl@1.92.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.92.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.92.0"
  - "@oxlint/binding-linux-riscv64-musl@1.92.0"
  - "@oxlint/binding-linux-s390x-gnu@1.92.0"
  - "@oxlint/binding-linux-x64-gnu@1.92.0"
  - "@oxlint/binding-linux-x64-musl@1.92.0"
  - "@oxlint/binding-openharmony-arm64@1.92.0"
  - "@oxlint/binding-win32-arm64-msvc@1.92.0"
  - "@oxlint/binding-win32-ia32-msvc@1.92.0"
  - "@oxlint/binding-win32-x64-msvc@1.92.0"
  - "@tailwindcss/node@4.3.5"
  - "@tailwindcss/oxide-android-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-x64@4.3.5"
  - "@tailwindcss/oxide-freebsd-x64@4.3.5"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.5"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.5"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.5"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.5"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.5"
  - "@tailwindcss/oxide@4.3.5"
  - "@tailwindcss/vite@4.3.5"
  - oxlint@1.92.0
  - rolldown-plugin-dts@0.30.0
  - tailwindcss@4.3.5
  - tsdown@0.23.7
